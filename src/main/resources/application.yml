spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:whatsapp_saas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    ignore-migration-patterns: "*:missing"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0


app:
  jwt:
    secret: ${JWT_SECRET:mude-esse-secret-em-producao-use-256-bits-no-minimo}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas
  base-url: ${BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

  whatsapp:
    api-version: ${WHATSAPP_API_VERSION:v19.0}
    app-secret: ${WHATSAPP_APP_SECRET:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:mude-este-token}

  whatsapp-service:
    url: ${WHATSAPP_SERVICE_URL:http://localhost:3001}
    secret: ${WHATSAPP_SERVICE_SECRET:dev-secret-change-in-production}

  # Credenciais AWS únicas para todos os serviços (S3, SES)
  # Se vazias, o SDK usa AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY do ambiente
  aws:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

  s3:
    bucket: ${S3_BUCKET:grupolink-media}
    region: ${S3_REGION:us-east-1}
    base-url: ${S3_BASE_URL:}

  # Provedor de e-mail transacional: "resend" (padrão) ou "ses".
  email:
    provider: ${EMAIL_PROVIDER:resend}

  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Redirect Grupo <noreply@redirectgrupo.com.br>}

  ses:
    region: ${SES_REGION:${S3_REGION:us-east-1}}
    from: ${SES_FROM_EMAIL:noreply@redirectgrupo.com.br}

  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  contact:
    email: ${CONTACT_EMAIL:contato@redirectgrupo.com.br}

  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}

  mercadolivre:
    client-id: ${ML_CLIENT_ID:}
    client-secret: ${ML_CLIENT_SECRET:}
    redirect-uri: ${ML_REDIRECT_URI:http://localhost:8080/api/ml/oauth/callback}

  amazon:
    # Scraping da Amazon desativado: IPs de datacenter (AWS) são bloqueados com CAPTCHA.
    # Reativar (AMAZON_ENABLED=true) só com PA-API oficial ou proxy residencial.
    enabled: ${AMAZON_ENABLED:false}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    # gemini-2.5-flash-lite: modelo mais barato disponível para a chave (billing ativo) e
    # qualidade sobrando para gerar texto curto de oferta. Override via GEMINI_MODEL.
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}

  rate-limit:
    redirect-limit: ${RATE_LIMIT_REDIRECT:30}   # máx requests por janela
    window-seconds: ${RATE_LIMIT_WINDOW:60}       # tamanho da janela em segundos

server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 20MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
