AWSTemplateFormatVersion: '2010-09-09'
Description: 'GrupoLink - ECS Cluster, ALB, ECR, IAM Roles'

Parameters:
  Environment:
    Type: String
    Default: prod
  VPCStackName:
    Type: String
    Default: grupolink-vpc
  AppImage:
    Type: String
    Default: 985818273645.dkr.ecr.us-east-1.amazonaws.com/grupolink-backend:latest

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub grupolink-${Environment}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub grupolink-${Environment}-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameters, ssm:GetParameter]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/grupolink/*

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub grupolink-${Environment}-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/grupolink-backend
      RetentionInDays: 30

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub grupolink-${Environment}-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue { 'Fn::Sub': '${VPCStackName}-PublicSubnet1' }
        - !ImportValue { 'Fn::Sub': '${VPCStackName}-PublicSubnet2' }
      SecurityGroups:
        - !ImportValue { 'Fn::Sub': '${VPCStackName}-ALBSg' }

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub grupolink-${Environment}-tg
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !ImportValue { 'Fn::Sub': '${VPCStackName}-VPC' }
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: grupolink-backend
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: grupolink-backend
          Image: !Ref AppImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: '8080'
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/grupolink-backend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command: [CMD-SHELL, "curl -f http://localhost:8080/actuator/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub grupolink-${Environment}
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !ImportValue { 'Fn::Sub': '${VPCStackName}-PublicSubnet1' }
            - !ImportValue { 'Fn::Sub': '${VPCStackName}-PublicSubnet2' }
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${VPCStackName}-AppSg' }
      LoadBalancers:
        - ContainerName: grupolink-backend
          ContainerPort: 8080
          TargetGroupArn: !Ref ALBTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100

Outputs:
  ALBDNSName:
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-ALBDNSName"
  ECSClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ECSCluster"
  ECRRepositoryUri:
    Value: !Sub "985818273645.dkr.ecr.us-east-1.amazonaws.com/grupolink-backend"
    Export:
      Name: !Sub "${AWS::StackName}-ECRUri"
